[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

# Same-origin endpoint for the lead form. The browser posts here instead of to
# leadconnectorhq.com, so corporate firewalls and tracker blockers have nothing
# to match on; the function forwards to GoHighLevel server-side.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

# SPA fallback — MUST stay last so it never shadows the /api/lead function.
# Without this, client-side routes like /planyourtripwithus return a hard 404
# on Netlify because no such file exists in dist/public.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
